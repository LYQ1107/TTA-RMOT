protocol:
  source_free_at_adaptation: true
  online: true
  predict_then_adapt: true
  reset_unit: video_expression
  allow_future_frames: false
  seed: 20261020

model:
  baseline: temprmot
  source_domain: refer_kitti_v2
  target_domain: refer_bdd
  baseline_checkpoint_name: checkpoint_rk2.pth
  source_root: /data2/user/reference_envs/temprmot/source
  checkpoint: /data2/user/LocateMOT/data/checkpoints/checkpoint_rk2.pth
  text_root: /data2/user/reference_envs/temprmot/roberta-base
  freeze_backbone: true
  freeze_text_encoder: true
  freeze_tracker: true
  external_referring_only: true

data:
  adapter: refer_bdd
  dataset: refer_bdd
  data_root: /data2/user/LocateMOT/data
  runtime_manifest: results/manifests/refer_bdd_runtime_manifest.jsonl
  evaluation_manifest: results/manifests/refer_bdd_evaluation_manifest.jsonl
  image_root: data/ReferBDD/refer-bdd/images/track/train
  expression_root: data/ReferBDD/refer-bdd/expressions
  label_root: data/ReferBDD/label_with_ids
  seqmap_file: /data2/user/LocateMOT/data/downloads/EchoTrack/assets/seqmap_bdd.txt
  query_text_source: sentence
  # EchoTrack writes JSON frame keys directly; BDD labels are normalized
  # top-left xywh (see inference_bdd.py::write_gt).
  trackeval_frame_offset: 0
  label_format: xywh_topleft
  videos:
    - 0000f77c-cb820c98
    - 00abd8a7-ecd6fc56
    - 00fcfec9-7ba5dabf
    - 02a17951-3d88d95e
    - 002b562f-e0ac84fe
    - 00f7eac8-5193d600
    - 0081da60-5fa22cc6
    - 00de601c-858a8a8d

inference:
  # Main protocol: calibrated absolute gates, fixed before target evaluation.
  objectness_threshold: 0.6
  area_threshold: 100
  referring_threshold: 0.4
  selection:
    mode: absolute
  cuda_visible_devices: auto

probe:
  enabled: true
  every_n_frames: 16
  max_query_count: 3
  static_history_frames: 1
  dynamic_history_frames: 4
  shared_raw_backbone: false
  min_match_iou: 0.6
  ambiguity_iou_margin: 0.05

evidence:
  positive_threshold: 0.8
  negative_threshold: 0.2
  equivalent_tolerance: 0.1
  contrast_margin: 0.3
  allow_forced_top1: false
  missing_probe_is_negative: false

memory:
  capacity: 512
  per_track_capacity: 16
  semantic_state_aware: true
  fixed_ttl_frames: 16

adaptation:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0
  update_every_n_frames: 4
  steps_per_update: 1
  batch_size: 32
  minimum_distinct_track_time_samples: 2
  grad_clip: 1.0
  max_abs_residual: 6.0
  hidden_dim: 32

methods:
  - FROZEN
  - ENTROPY_HEAD
  - PROBE_ST
  - PROBE_CACHE
  - QCS_TTA
  - NO_STATE
