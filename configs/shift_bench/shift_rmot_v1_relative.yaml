protocol:
  name: ShiftRMOT-Bench-v1-relative-rank
  source_free_at_adaptation: true
  online: true
  predict_then_adapt: true
  reset_unit: video_expression_condition
  allow_future_frames: false
  seed: 20261020
  raw_images_copied: false
  visual_variants_materialized: false
  structure_change: "relative current-frame referring margin after objectness/area candidate visibility"

model:
  baseline: temprmot
  source_domain: refer_kitti_v2
  target_domain: refer_kitti_v2_visual_language_shifts
  source_root: /data2/user/reference_envs/temprmot/source
  checkpoint: /data2/user/LocateMOT/data/checkpoints/checkpoint_rk2.pth
  text_root: /data2/user/reference_envs/temprmot/roberta-base
  freeze_backbone: true
  freeze_text_encoder: true
  freeze_tracker: true
  external_referring_only: true

data:
  dataset: shift_rmot_v1_relative
  compact_shift_manifest: true
  dataset_root: data/ShiftRMOT-v1
  runtime_manifest: data/ShiftRMOT-v1/manifests/paired_conditions.jsonl
  evaluation_manifest: data/ShiftRMOT-v1/manifests/paired_conditions_evaluation.jsonl
  videos: ["0005", "0011", "0013", "0019"]
  label_format: cxcywh
  trackeval_frame_offset: 1

inference:
  # The relative structure exposes valid frozen tracker candidates first;
  # it does not force top-1 and keeps every candidate within a fixed logit
  # margin of the current-frame best score.
  objectness_threshold: 0.0
  area_threshold: 0.0
  referring_threshold: 0.4
  selection:
    mode: relative_margin
    relative_logit_margin: 0.75
    max_candidates_per_frame: 16
  cuda_visible_devices: auto

probe:
  enabled: true
  every_n_frames: 16
  max_query_count: 3
  static_history_frames: 1
  dynamic_history_frames: 4
  shared_raw_backbone: false
  min_match_iou: 0.6
  ambiguity_iou_margin: 0.05

evidence:
  positive_threshold: 0.8
  negative_threshold: 0.2
  equivalent_tolerance: 0.1
  contrast_margin: 0.3
  allow_forced_top1: false
  missing_probe_is_negative: false

memory:
  capacity: 512
  per_track_capacity: 16
  semantic_state_aware: true
  fixed_ttl_frames: 16

adaptation:
  optimizer: adamw
  lr: 0.001
  weight_decay: 0.0
  update_every_n_frames: 4
  steps_per_update: 1
  batch_size: 32
  minimum_distinct_track_time_samples: 2
  grad_clip: 1.0
  max_abs_residual: 6.0
  hidden_dim: 32

methods:
  - FROZEN
  - TDA_RMOT
  - SAR_VISUAL_INSPIRED
  - TPT_LANGUAGE_INSPIRED
  - TCR_FUSION_INSPIRED
